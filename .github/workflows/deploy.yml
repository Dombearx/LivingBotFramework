name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Netbird
        uses: Alemiz112/netbird-connect@v1
        with:
          setup-key: ${{ secrets.NETBIRD_ACCESS_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Trigger Mugda update
        run: |
          echo "::group::Netbird detailed status"
          sudo netbird status --detail
          echo "::endgroup::"

          echo "::group::DNS resolver state"
          resolvectl status
          echo "::endgroup::"

          echo "::group::Update request"
          curl -v -fsS "${{ secrets.MUGDA_UPDATE_SERVER_URL }}"
          echo "::endgroup::"
