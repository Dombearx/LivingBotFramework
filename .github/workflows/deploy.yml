name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Join Netbird network
        uses: hackiron/public-actions/netbird-connect@main
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          hostname: github-actions-deploy
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Trigger Mugda update
        run: curl -fsS "${{ secrets.MUGDA_UPDATE_SERVER_URL }}"
