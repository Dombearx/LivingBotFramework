name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Netbird
        uses: ./.github/actions/netbird-connect
        with:
          setup-key: ${{ secrets.NETBIRD_ACCESS_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Trigger Mugda update
        run: curl -fsS "${{ secrets.MUGDA_UPDATE_SERVER_URL }}"
