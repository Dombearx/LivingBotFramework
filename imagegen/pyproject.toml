[project]
name = "imagegen"
version = "0.1.0"
description = "HTTP service that turns prompts into images via RunPod"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "logfire[fastapi,httpx]>=4.34.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
imagegen = "imagegen.app:run"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.logfire]
ignore_no_config = true
